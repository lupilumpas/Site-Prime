<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17120d">
<title>Livro Interativo</title>
<link rel="stylesheet" href="Suporte.css">
<link rel="stylesheet" href="Extras/Animações.css">
</head>
<body>
<div class="ambient ambient-one"></div>
<div class="ambient ambient-two"></div>

<main class="stage" id="stage">

      <a href="https://api.whatsapp.com/send/?phone=5541991371245&text=Ol%C3%A1%21%20Vim%20pela%20p%C3%A1gina%20JDM%20Madeiras%20e%20gostaria%20de%20solicitar%20um%20or%C3%A7amento%20para%20o%20meu%20ambiente."
   class="hero-left-link"
   target="_blank"
   aria-label="Acessar WhatsApp">

    <div class="hero-left-content">

        <img src="Img/Img/Whatsapp.png"
             class="WhatsApp-icon"
             alt="WhatsApp">

        <div class="WhatsApp-expand">

            <img src="Img/Img/QRCode Whats.png"
                 class="hero-image-left"
                 alt="QR Code do WhatsApp">

            <span class="hero-left-text">
                !Escaneie ou Clique!
            </span>

        </div>

    </div>

</a>

<a href="https://www.instagram.com/jdmnichos?igsi=bHQ1cHNqM205eTF1"
   class="hero-right-link"
   target="_blank"
   aria-label="Acessar Instagram">

    <div class="hero-right-content">

        <img src="Img/Img/Instagram.png"
             class="instagram-icon"
             alt="Instagram">

        <div class="instagram-expand">

            <img src="Img/Img/QRCode Insta.png"
                 class="hero-image-right"
                 alt="QR Code do Instagram">

            <span class="hero-right-text">
                !Escaneie ou Clique!
            </span>

        </div>

    </div>

</a>

  <div class="book-shadow"></div>

<section class="book" id="book">

    <div class="book-part cover-image front-cover" id="frontCover">
        <img src="Img/Livro/Capa.png" alt="Capa">
    </div>

    <div class="book-part page-image left-page" id="leftPage">
        <img src="Img/Livro/FolhadaEsquerda.png" alt="" class="page-background">

        <div class="page-content" id="leftContent"></div>
        <div class="page-number" id="leftNumber"></div>
    </div>

    <div class="book-part page-image right-page" id="rightPage">
        <img src="Img/Livro/FolhadaDireita.png" alt="" class="page-background">

        <div class="page-content" id="rightContent"></div>
        <div class="page-number" id="rightNumber"></div>
    </div>

    <div class="book-part cover-image back-cover">
        <img src="Img/Livro/Contra-Capa.png" alt="Contracapa">
    </div>

</section>

</main>

<nav class="controls" aria-label="Controles do livro">
  <button class="control-button" id="prevButton" aria-label="Página anterior">
    <span class="control-icon">←</span>
    <span>Anterior</span>
  </button>
  <button class="control-button primary" id="nextButton" aria-label="Próxima página">
    <span>Próxima</span>
    <span class="control-icon">→</span>
  </button>
</nav>

<div class="toast" id="toast" role="status"></div>

<script src="Suporte.js"></script>
<script src="Extras/Animações.js"></script>
</body>
</html>
